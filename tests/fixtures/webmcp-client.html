<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebMCP integration client</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 1rem;
      }
      iframe {
        width: 100%;
        height: 620px;
        border: 1px solid #bbb;
      }
      textarea {
        display: block;
        width: 95%;
        height: 180px;
      }
      button {
        margin: 1rem 0.5rem 1rem 0;
        padding: 0.6rem;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>WebMCP integration client</h1>
    <p>
      Test-only same-origin client for the installed 5.0.1 polyfill. Uses public
      discovery and execution APIs. Not included in the application build.
    </p>
    <iframe src="/" title="AI Dev Days survey"></iframe>
    <button id="discover">Discover survey tools</button>
    <pre id="tools" aria-label="Discovered tools"></pre>
    <label for="answers">Synthetic survey answers</label>
    <textarea id="answers">
{
  "talk": "Building Reliable AI Agents",
  "rating": 9,
  "ratingReason": "Practical guidance I can apply to production agent workflows.",
  "swagGift": "Keyboard",
  "name": "Casey Morgan",
  "shippingAddress": "123 Example Lane, Chicago, IL 60601"
}</textarea>
    <button id="invoke" disabled>Submit through assistant</button>
    <pre id="result" role="status" aria-label="Tool result"></pre>
    <script>
      const frame = document.querySelector('iframe')
      const toolsOutput = document.querySelector('#tools')
      const invoke = document.querySelector('#invoke')
      let context
      let tool
      document
        .querySelector('#discover')
        .addEventListener('click', async () => {
          context = frame.contentDocument.modelContext
          const tools = await context.getTools()
          toolsOutput.textContent = JSON.stringify(
            tools.map(({ window, ...metadata }) => metadata),
            null,
            2,
          )
          tool = tools.find(({ name }) => name === 'submit_ai_dev_days_survey')
          invoke.disabled = !tool || !context.executeTool
        })
      invoke.addEventListener('click', async () => {
        invoke.disabled = true
        try {
          const answers = JSON.parse(document.querySelector('#answers').value)
          document.querySelector('#result').textContent =
            await context.executeTool(tool, JSON.stringify(answers))
        } catch {
          document.querySelector('#result').textContent =
            'Execution could not be confirmed. Check responses before repeating.'
        } finally {
          invoke.disabled = false
        }
      })
    </script>
  </body>
</html>
